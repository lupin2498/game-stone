name: Deploy web/PWA (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'stone-balance.html'
      - 'auth.html'
      - 'online.js'
      - 'firebase-config.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - 'build-site.sh'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Cấu hình máy chủ đăng nhập (nếu có secret FIREBASE_CONFIG_JS)
        env:
          FIREBASE_CONFIG_JS: ${{ secrets.FIREBASE_CONFIG_JS }}
        run: if [ -n "$FIREBASE_CONFIG_JS" ]; then printf '%s\n' "$FIREBASE_CONFIG_JS" > firebase-config.js; fi
      - name: Dựng thư mục site
        run: ./build-site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
